[tool.poetry]
name = "geneal"
version = "0.10.0"
description = "Python Genetic Algorithm library"
license = "MIT License"
authors = ["Diogo Matos Chaves <diogo_chaves@hotmail.com>"]
readme = "README.md"
repository = "https://github.com/diogomatoschaves/geneal"
keywords = ["genetic algorithms", "ga", "optimization", "genetic programming"]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = ">=1.21"
# Optional: fitness plot at the end of solve() (`plot_results=True`)
matplotlib = { version = ">=3.5", optional = true }
# Optional: Travelling Salesman Problem application (geneal.applications.tsp)
numba = { version = ">=0.56", optional = true }
networkx = { version = ">=2.6", optional = true }
pandas = { version = ">=1.3", optional = true }
plotly = { version = ">=5.10", optional = true }

[tool.poetry.extras]
plot = ["matplotlib"]
tsp = ["numba", "networkx", "pandas", "plotly"]
all = ["matplotlib", "numba", "networkx", "pandas", "plotly"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.1.3"
pytest-cov = ">=3.0.0"
pytest-mock = ">=3.8.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
